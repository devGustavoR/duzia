name: CI & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      # npm install (not ci): the lockfile can drift on cross-platform optional
      # deps (@emnapi/* under *-wasm32-wasi packages) when regenerated off-Linux.
      # The deploy Dockerfiles also use npm install, so CI matches them.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm install --no-audit --no-fund
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  deploy:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            mkdir -p /opt/duzia

            if [ -d /opt/duzia/.git ]; then
              git -C /opt/duzia pull origin main
            else
              git clone git@github.com:${{ github.repository }}.git /opt/duzia
            fi

            cd /opt/duzia

            cat > back-end/.env << 'ENV_EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            API_KEY=${{ secrets.API_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
            FRONTEND_URL=https://duzia.devgustavor.com.br
            PORT=3001
            ENV_EOF

            cat > front-end/.env << 'ENV_EOF'
            ENV_EOF

            cat > .env << 'ENV_EOF'
            NEXT_PUBLIC_API_URL=https://api-duzia.devgustavor.com.br/api
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            ENV_EOF

            cat > /etc/nginx/sites-available/duzia-backend << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name api-duzia.devgustavor.com.br;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name api-duzia.devgustavor.com.br;

                ssl_certificate     /etc/ssl/cf-origin.pem;
                ssl_certificate_key /etc/ssl/cf-origin.key;

                location / {
                    proxy_pass http://127.0.0.1:3011;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                }
            }
            NGINX_EOF

            cat > /etc/nginx/sites-available/duzia-frontend << 'NGINX_EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name duzia.devgustavor.com.br;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name duzia.devgustavor.com.br;

                ssl_certificate     /etc/ssl/cf-origin.pem;
                ssl_certificate_key /etc/ssl/cf-origin.key;

                location / {
                    proxy_pass http://127.0.0.1:3010;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                }
            }
            NGINX_EOF

            ln -sf /etc/nginx/sites-available/duzia-backend /etc/nginx/sites-enabled/duzia-backend
            ln -sf /etc/nginx/sites-available/duzia-frontend /etc/nginx/sites-enabled/duzia-frontend
            nginx -t && systemctl reload nginx

            docker compose build

            # Run DB migrations with the freshly built backend image BEFORE
            # swapping containers. set -e aborts the deploy on failure, so the
            # currently running containers stay untouched.
            docker compose run --rm --no-deps backend npm run migration:run

            docker compose up -d
            docker image prune -f

  health-check:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend /health to return 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api-duzia.devgustavor.com.br/health || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "Backend healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not return 200 on /health within ~5min after deploy"
          exit 1
